services:
  # ─── BACKEND WEB SERVICE ─────────────────────────────────────
  - type: web
    name: trackx-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/trackx.db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set this to your frontend URL in the dashboard to enable CORS

  # ─── FRONTEND STATIC SITE ─────────────────────────────────────
  - type: web
    name: trackx-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Rewrite all requests to index.html for client-side React routing (fixes 404s on page refresh or deep links)
      - type: rewrite
        source: /*
        destination: /index.html
